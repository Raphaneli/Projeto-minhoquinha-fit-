<!-- Firebase (usado para sincronizar o treino entre os dois celulares em tempo real) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useRef } = React;

const FONT_IMPORT = `
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap');
`;

const STORAGE_KEY = "workout-plan";

function storageGet(key) {
  return new Promise((resolve) => {
    try {
      const raw = window.localStorage.getItem(key);
      resolve(raw === null ? null : { key, value: raw });
    } catch (err) {
      resolve(null);
    }
  });
}

function storageSet(key, value) {
  return new Promise((resolve) => {
    try {
      window.localStorage.setItem(key, value);
      resolve({ key, value });
    } catch (err) {
      resolve(null);
    }
  });
}

function storageDelete(key) {
  return new Promise((resolve) => {
    try {
      window.localStorage.removeItem(key);
      resolve({ key, deleted: true });
    } catch (err) {
      resolve(null);
    }
  });
}

const uid = () => Math.random().toString(36).slice(2, 10);

// ⚠️ Cole aqui as credenciais do SEU projeto Firebase (veja instruções que o Claude te mandou no chat)
const firebaseConfig = {
  apiKey: "COLE_AQUI",
  authDomain: "COLE_AQUI",
  databaseURL: "COLE_AQUI",
  projectId: "COLE_AQUI",
  storageBucket: "COLE_AQUI",
  messagingSenderId: "COLE_AQUI",
  appId: "COLE_AQUI",
};

const firebaseConfigured = firebaseConfig.apiKey !== "COLE_AQUI" && !!firebaseConfig.databaseURL;

let dbRef = null;
if (firebaseConfigured) {
  try {
    firebase.initializeApp(firebaseConfig);
    dbRef = firebase.database().ref("workout-plan");
  } catch (err) {
    dbRef = null;
  }
}

const emptyExercise = () => ({
  id: uid(),
  name: "",
  muscle: "",
  sets: 3,
  reps: "12",
  load: "",
  rest: "60s",
  notes: "",
  videoUrl: "",
});

const defaultPlan = () => ({
  days: [
    {
      id: uid(),
      name: "Treino A",
      focus: "",
      exercises: [],
    },
  ],
  completion: {},
});

function App() {
  const [role, setRole] = useState(undefined); // undefined = loading, null = not chosen
  const [plan, setPlan] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");
  const [storageOk, setStorageOk] = useState(true);

  useEffect(() => {
    (async () => {
      try {
        const savedRole = await storageGet("my-role");
        setRole(savedRole ? savedRole.value : null);
      } catch (err) {
        setRole(null);
      }

      // Mostra a cópia local instantaneamente enquanto conecta na nuvem
      try {
        const cached = await storageGet(STORAGE_KEY);
        if (cached) setPlan(JSON.parse(cached.value));
      } catch (err) {
        /* sem cópia local ainda, sem problema */
      }

      if (!dbRef) {
        // Firebase não configurado: usa só a cópia local deste aparelho
        setPlan((prev) => prev || defaultPlan());
        setStorageOk(false);
        setLoading(false);
        return;
      }

      dbRef.on(
        "value",
        (snapshot) => {
          const data = snapshot.val();
          const nextPlan = data || defaultPlan();
          setPlan(nextPlan);
          storageSet(STORAGE_KEY, JSON.stringify(nextPlan));
          setStorageOk(true);
          setLoading(false);
        },
        () => {
          setPlan((prev) => prev || defaultPlan());
          setStorageOk(false);
          setLoading(false);
        }
      );
    })();
  }, []);

  const savePlan = useCallback(async (newPlan) => {
    setPlan(newPlan);
    storageSet(STORAGE_KEY, JSON.stringify(newPlan)); // cópia local, sempre
    if (!dbRef) {
      setError("");
      return;
    }
    try {
      await dbRef.set(newPlan);
      setError("");
    } catch (err) {
      setError("Não consegui sincronizar com a nuvem agora (ficou salvo só neste aparelho).");
    }
  }, []);

  const exportPlan = () => {
    try {
      const blob = new Blob([JSON.stringify(plan, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "treino-backup.json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch {
      setError("Não consegui exportar o arquivo agora.");
    }
  };

  const importPlan = (file) => {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed || !Array.isArray(parsed.days)) throw new Error("formato inválido");
        savePlan(parsed);
      } catch {
        setError("Esse arquivo não parece ser um backup de treino válido.");
      }
    };
    reader.readAsText(file);
  };

  const chooseRole = async (r) => {
    setRole(r);
    try {
      await storageSet("my-role", r);
    } catch {
      /* non-fatal */
    }
  };

  const switchRole = async () => {
    setRole(null);
    try {
      await storageDelete("my-role");
    } catch {
      /* non-fatal */
    }
  };

  return (
    <div
      data-app-loaded="true"
      style={{
        minHeight: "100vh",
        width: "100%",
        background: "#F8FAFC",
        color: "#172033",
        fontFamily: "'Inter', sans-serif",
        position: "relative",
      }}
    >
      <style>{FONT_IMPORT}</style>
      {loading || role === undefined ? (
        <LoadingState />
      ) : role === null ? (
        <LoginScreen onChoose={chooseRole} />
      ) : plan === null ? (
        <LoadingState />
      ) : role === "trainer" ? (
        <TrainerView
          plan={plan}
          savePlan={savePlan}
          onSwitch={switchRole}
          error={error}
          storageOk={storageOk}
          onExport={exportPlan}
          onImport={importPlan}
        />
      ) : (
        <StudentView plan={plan} savePlan={savePlan} onSwitch={switchRole} error={error} storageOk={storageOk} />
      )}
    </div>
  );
}

function LoadingState() {
  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "center", minHeight: "500px" }}>
      <div style={{ color: "#64748B", fontSize: "14px" }}>Carregando treino…</div>
    </div>
  );
}

function LoginScreen({ onChoose }) {
  const [showGate, setShowGate] = useState(false);

  return (
    <div
      style={{
        minHeight: "100vh",
        display: "flex",
        flexDirection: "column",
        alignItems: "center",
        justifyContent: "center",
        padding: "48px 24px",
        background:
          "radial-gradient(circle at 20% 15%, rgba(37,99,235,0.06), transparent 45%), radial-gradient(circle at 85% 85%, rgba(167,139,250,0.07), transparent 45%)",
      }}
    >
      <div style={{ display: "flex", alignItems: "center", gap: "10px", marginBottom: "8px" }}>
        <span style={{ fontSize: "26px", lineHeight: 1, display: "inline-block" }}>🏋️</span>
        <span style={{ fontFamily: "'Oswald', sans-serif", fontSize: "15px", letterSpacing: "0.5px", color: "#64748B" }}>
          plano de treino
        </span>
      </div>
      <h1
        style={{
          fontFamily: "'Oswald', sans-serif",
          fontWeight: 600,
          fontSize: "34px",
          textAlign: "center",
          margin: "4px 0 40px",
          lineHeight: 1.15,
        }}
      >
        Quem está entrando hoje?

const TRAINER_PASSWORD = "treino123"; // peça para o Claude trocar esse valor quando quiser uma senha nova

function PasswordGate({ onSuccess, onCancel }) {
  const [value, setValue] = useState("");
  const [error, setError] = useState("");

  const handleEnter = () => {
    if (value === TRAINER_PASSWORD) {
      onSuccess();
    } else {
      setError("Senha incorreta.");
      setValue("");
    }
  };

  return (
    <div style={overlayStyle()}>
      <div style={modalStyle()}>
        <div style={{ display: "flex", alignItems: "center", gap: "8px", marginBottom: "14px" }}>
          <span style={{ fontSize: "18px", lineHeight: 1, display: "inline-block" }}>🔒</span>
          <span style={{ fontFamily: "'Oswald', sans-serif", fontSize: "16px", fontWeight: 600 }}>Área do personal</span>
        </div>

        <Field label="Senha">
          <input
            autoFocus
            type="password"
            value={value}
            onChange={(e) => setValue(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && handleEnter()}
            style={inputStyle()}
          />
        </Field>

        {error && <div style={{ color: "#DC2626", fontSize: "12px", marginTop: "10px" }}>{error}</div>}

        <div style={{ display: "flex", justifyContent: "space-between", marginTop: "18px", gap: "10px" }}>
          <button onClick={onCancel} style={ghostBtn()}>
            cancelar
          </button>
          <button onClick={handleEnter} style={smallBtn("#2563EB", "#FFFFFF")}>
            entrar
          </button>
        </div>
      </div>
    </div>
  );
}

function TrainerView({ plan, savePlan, onSwitch, error, storageOk, onExport, onImport }) {
  const [activeId, setActiveId] = useState(plan.days[0]?.id);
  const [editingExId, setEditingExId] = useState(null);
  const [confirmDeleteDay, setConfirmDeleteDay] = useState(false);
  const fileInputRef = useRef(null);

  useEffect(() => {
    if (!plan.days.find((d) => d.id === activeId)) setActiveId(plan.days[0]?.id);
  }, [plan, activeId]);

  const activeDay = plan.days.find((d) => d.id === activeId);
  const dayFeedback = plan.completion?.[activeId] || {};

  const updateDays = (days) => savePlan({ ...plan, days });

  const addDay = () => {
    const n = plan.days.length + 1;
    const newDay = { id: uid(), name: `Treino ${String.fromCharCode(64 + n)}`, focus: "", exercises: [] };
    updateDays([...plan.days, newDay]);
    setActiveId(newDay.id);
  };

  const renameDay = (name) => {
    updateDays(plan.days.map((d) => (d.id === activeId ? { ...d, name } : d)));
  };

  const setFocus = (focus) => {
    updateDays(plan.days.map((d) => (d.id === activeId ? { ...d, focus } : d)));
  };

  const deleteDay = () => {
    const remaining = plan.days.filter((d) => d.id !== activeId);
    updateDays(remaining.length ? remaining : [{ id: uid(), name: "Treino A", focus: "", exercises: [] }]);
    setConfirmDeleteDay(false);
  };

  const addExercise = () => {
    const ex = emptyExercise();
    updateDays(
      plan.days.map((d) => (d.id === activeId ? { ...d, exercises: [...d.exercises, ex] } : d))
    );
    setEditingExId(ex.id);
  };

  const updateExercise = (exId, patch) => {
    updateDays(
      plan.days.map((d) =>
        d.id === activeId
          ? { ...d, exercises: d.exercises.map((e) => (e.id === exId ? { ...e, ...patch } : e)) }
          : d
      )
    );
  };

  const deleteExercise = (exId) => {
    updateDays(
      plan.days.map((d) =>
        d.id === activeId ? { ...d, exercises: d.exercises.filter((e) => e.id !== exId) } : d
      )
    );
  };

  if (!activeDay) return null;

  return (
    <div>
      <TopBar
        label="Montar treino"
        accent="#2563EB"
        onSwitch={onSwitch}
        extra={
          <>
            <button onClick={onExport} style={ghostBtn()}>
              exportar
            </button>
            <button onClick={() => fileInputRef.current?.click()} style={ghostBtn()}>
              importar
            </button>
            <input
              ref={fileInputRef}
              type="file"
              accept="application/json"
              style={{ display: "none" }}
              onChange={(e) => {
                if (e.target.files?.[0]) onImport(e.target.files[0]);
                e.target.value = "";
              }}
            />
          </>
        }
      />
      {!storageOk && (
        <div
          style={{
            margin: "14px 24px 0",
            padding: "12px 14px",
            background: "rgba(96,165,250,0.10)",
            border: "1px solid #60A5FA",
            borderRadius: "10px",
            fontSize: "12.5px",
            color: "#172033",
            lineHeight: 1.5,
          }}
        >
          A sincronização automática com o celular dela ainda não está ativa (configure o Firebase no
          código). Por enquanto, o treino fica salvo só neste aparelho — use{" "}
          <strong>exportar</strong> para baixar um backup e <strong>importar</strong> no outro celular.
        </div>
      )}
      <DayTabs days={plan.days} activeId={activeId} setActiveId={setActiveId} accent="#2563EB" onAddDay={addDay} editable />

      <div style={{ padding: "20px 24px 40px" }}>
        <div
          style={{
            background: "#FFFFFF",
            borderRadius: "0 12px 12px 12px",
            padding: "20px",
            marginBottom: "18px",
            border: "1px solid #E2E8F0",
            boxShadow: "0 1px 3px rgba(23,32,51,0.05)",
          }}
        >
          <div style={{ display: "flex", gap: "12px", flexWrap: "wrap", alignItems: "center", marginBottom: "8px" }}>
            <input
              value={activeDay.name}
              onChange={(e) => renameDay(e.target.value)}
              style={inputStyle({ fontFamily: "'Oswald', sans-serif", fontSize: "18px", fontWeight: 600, width: "180px", background: "transparent", border: "none", padding: "2px 0" })}
            />
            {plan.days.length > 1 && (
              <button onClick={() => setConfirmDeleteDay(true)} style={ghostBtn()}>
                <span style={{ fontSize: "14px", lineHeight: 1, display: "inline-block" }}>🗑️</span> excluir dia
              </button>
            )}
          </div>
          <input
            value={activeDay.focus}
            onChange={(e) => setFocus(e.target.value)}
            placeholder="Foco do dia (ex: pernas e glúteo)"
            style={inputStyle({ fontSize: "13px", color: "#64748B", background: "transparent", border: "none", padding: "2px 0", width: "100%" })}
          />

          {confirmDeleteDay && (
            <div style={{ marginTop: "10px", fontSize: "12.5px", color: "#DC2626", display: "flex", gap: "10px", alignItems: "center" }}>
              Excluir "{activeDay.name}" e todos os exercícios dele?
              <button onClick={deleteDay} style={smallBtn("#EF4444")}>Sim, excluir</button>
              <button onClick={() => setConfirmDeleteDay(false)} style={smallBtn("#E2E8F0", "#172033")}>Cancelar</button>
            </div>
          )}
        </div>

        <div style={{ display: "flex", flexDirection: "column", gap: "10px" }}>
          {activeDay.exercises.map((ex) =>
            editingExId === ex.id ? (
              <ExerciseEditor
                key={ex.id}
                exercise={ex}
                onChange={(patch) => updateExercise(ex.id, patch)}
                onDone={() => setEditingExId(null)}
                onDelete={() => {
                  deleteExercise(ex.id);
                  setEditingExId(null);
                }}
              />
            ) : (
              <ExerciseRow key={ex.id} exercise={ex} feedback={dayFeedback[ex.id]} onEdit={() => setEditingExId(ex.id)} onDelete={() => deleteExercise(ex.id)} />
            )
          )}

          {activeDay.exercises.length === 0 && (
            <div style={{ padding: "28px", textAlign: "center", color: "#64748B", fontSize: "13.5px", border: "1px dashed #E2E8F0", borderRadius: "12px" }}>
              Nenhum exercício ainda. Adicione o primeiro abaixo.
            </div>
          )}

          <button onClick={addExercise} style={addExerciseBtn()}>
            <span style={{ fontSize: "16px", lineHeight: 1, display: "inline-block" }}>➕</span> Adicionar exercício
          </button>
        </div>
      </div>

      {error && <ErrorBanner text={error} />}
    </div>
  );
}

function StudentView({ plan, savePlan, onSwitch, error, storageOk }) {
  const [activeId, setActiveId] = useState(plan.days[0]?.id);

  useEffect(() => {
    if (!plan.days.find((d) => d.id === activeId)) setActiveId(plan.days[0]?.id);
  }, [plan, activeId]);

  const activeDay = plan.days.find((d) => d.id === activeId);
  if (!activeDay) {
    return (
      <div>
        <TopBar label="Meu treino" accent="#A78BFA" onSwitch={onSwitch} />
        <StudentGreeting />
        <div style={{ padding: "60px 24px", textAlign: "center", color: "#64748B" }}>
          Seu personal ainda não montou nenhum treino. Volte mais tarde! 💪
        </div>
      </div>
    );
  }

  const doneMap = plan.completion?.[activeDay.id] || {};
  const doneCount = activeDay.exercises.filter((e) => doneMap[e.id]?.done).length;
  const total = activeDay.exercises.length;

  const toggleDone = (exId) => {
    const dayMap = { ...(plan.completion?.[activeDay.id] || {}) };
    dayMap[exId] = { ...(dayMap[exId] || {}), done: !dayMap[exId]?.done };
    savePlan({ ...plan, completion: { ...plan.completion, [activeDay.id]: dayMap } });
  };

  const updateFeedback = (exId, patch) => {
    const dayMap = { ...(plan.completion?.[activeDay.id] || {}) };
    dayMap[exId] = { ...(dayMap[exId] || {}), ...patch };
    savePlan({ ...plan, completion: { ...plan.completion, [activeDay.id]: dayMap } });
  };

  const resetDay = () => {
    savePlan({ ...plan, completion: { ...plan.completion, [activeDay.id]: {} } });
  };

  return (
    <div>
      <TopBar label="Meu treino" accent="#A78BFA" onSwitch={onSwitch} />
      <StudentGreeting />
      <DayTabs days={plan.days} activeId={activeId} setActiveId={setActiveId} accent="#A78BFA" editable={false} />

      <div style={{ padding: "20px 24px 40px" }}>
        <div style={{ background: "#FFFFFF", borderRadius: "0 12px 12px 12px", padding: "18px 20px", marginBottom: "18px", border: "1px solid #E2E8F0", boxShadow: "0 1px 3px rgba(23,32,51,0.05)" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: "10px" }}>
            <div>
              <div style={{ fontFamily: "'Oswald', sans-serif", fontSize: "19px", fontWeight: 600 }}>{activeDay.name}</div>
              {activeDay.focus && <div style={{ fontSize: "13px", color: "#64748B", marginTop: "3px" }}>{activeDay.focus}</div>}
            </div>
            {total > 0 && (
              <div style={{ display: "flex", alignItems: "center", gap: "10px" }}>
                <span style={{ fontSize: "12.5px", color: "#64748B" }}>{doneCount}/{total} feitos</span>
                <button onClick={resetDay} style={ghostBtn()}>
                  <span style={{ fontSize: "13px", lineHeight: 1, display: "inline-block" }}>🔄</span> reiniciar
                </button>
              </div>
            )}
          </div>
          {total > 0 && (
            <div style={{ height: "6px", background: "#E2E8F0", borderRadius: "4px", marginTop: "12px", overflow: "hidden" }}>
              <div
                style={{
                  height: "100%",
                  width: `${(doneCount / total) * 100}%`,
                  background: "#2563EB",
                  transition: "width 0.25s ease",
                }}
              />
            </div>
          )}
        </div>

        {total === 0 ? (
          <div style={{ padding: "40px", textAlign: "center", color: "#64748B", fontSize: "13.5px", border: "1px dashed #E2E8F0", borderRadius: "12px" }}>
            Ainda não tem exercícios cadastrados para este dia.
          </div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: "10px" }}>
            {activeDay.exercises.map((ex) => {
              const done = !!doneMap[ex.id]?.done;
              const loggedLoad = doneMap[ex.id]?.load ?? "";
              const pse = doneMap[ex.id]?.pse ?? null;
              const note = doneMap[ex.id]?.note ?? "";
              return (
                <div
                  key={ex.id}
                  onClick={() => toggleDone(ex.id)}
                  style={{
                    background: "#FFFFFF",
                    border: `1px solid ${done ? "#2563EB" : "#E2E8F0"}`,
                    borderRadius: "12px",
                    padding: "14px 16px",
                    display: "flex",
                    alignItems: "flex-start",
                    gap: "14px",
                    cursor: "pointer",
                    opacity: done ? 0.6 : 1,
                    boxShadow: "0 1px 2px rgba(23,32,51,0.04)",
                    transition: "opacity 0.15s ease, border-color 0.15s ease",
                  }}
                >
                  <div
                    style={{
                      minWidth: "22px",
                      height: "22px",
                      borderRadius: "6px",
                      border: `1.5px solid ${done ? "#2563EB" : "#E2E8F0"}`,
                      background: done ? "#2563EB" : "transparent",
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                      marginTop: "2px",
                    }}
                  >
                    {done && <span style={{ fontSize: "14px", lineHeight: 1, display: "inline-block" }}>✔️</span>}
                  </div>
                  <div style={{ flex: 1 }}>
                    <div
                      style={{
                        fontFamily: "'Oswald', sans-serif",
                        fontSize: "15px",
                        fontWeight: 500,
                        textDecoration: done ? "line-through" : "none",
                      }}
                    >
                      {ex.name || "(sem nome)"}
                    </div>
                    {ex.muscle && (
                      <span
                        style={{
                          display: "inline-block",
                          marginTop: "4px",
                          padding: "2px 9px",
                          borderRadius: "20px",
                          background: "rgba(167,139,250,0.14)",
                          color: "#7C5CE0",
                          fontSize: "11px",
                          fontWeight: 600,
                        }}
                      >
                        {ex.muscle}
                      </span>
                    )}
                    <div style={{ display: "flex", gap: "14px", marginTop: "8px", flexWrap: "wrap" }}>
                      <Stat icon={<span style={{ fontSize: "13px", lineHeight: 1, display: "inline-block" }}>📚</span>} value={`${ex.sets}x`} label="séries" />
                      <Stat icon={<span style={{ fontSize: "13px", lineHeight: 1, display: "inline-block" }}>🔁</span>} value={ex.reps} label="reps" />
                      {ex.load && <Stat icon={<span style={{ fontSize: "13px", lineHeight: 1, display: "inline-block" }}>⚖️</span>} value={ex.load} label="carga" />}
                      <Stat icon={<span style={{ fontSize: "13px", lineHeight: 1, display: "inline-block" }}>⏱️</span>} value={ex.rest} label="descanso" />
                    </div>
                    {ex.notes && (
                      <div style={{ fontSize: "12.5px", color: "#64748B", marginTop: "8px", fontStyle: "italic" }}>
                        {ex.notes}
                      </div>
                    )}
                    {ex.videoUrl && (
                      <a
                        href={ex.videoUrl}
                        target="_blank"
                        rel="noopener noreferrer"
                        onClick={(e) => e.stopPropagation()}
                        style={{ display: "inline-flex", alignItems: "center", gap: "5px", marginTop: "9px", fontSize: "12px", color: "#2563EB", textDecoration: "none" }}
                      >
                        <span style={{ fontSize: "14px", lineHeight: 1, display: "inline-block" }}>▶️</span> ver vídeo de execução
                      </a>
                    )}
                    <div
                      onClick={(e) => e.stopPropagation()}
                      style={{ display: "flex", alignItems: "center", gap: "8px", marginTop: "10px" }}
                    >
                      <span style={{ fontSize: "13px", lineHeight: 1, display: "inline-block" }}>📝</span>
                      <input
                        value={loggedLoad}
                        onChange={(e) => updateFeedback(ex.id, { load: e.target.value })}
                        placeholder="Anotar carga que você usou"
                        style={{ ...inputStyle(), padding: "6px 9px", fontSize: "12.5px", flex: 1, maxWidth: "220px" }}
                      />
                    </div>

                    <div onClick={(e) => e.stopPropagation()} style={{ marginTop: "12px" }}>
                      <div style={{ display: "flex", alignItems: "center", gap: "6px", marginBottom: "6px" }}>
                        <span style={{ fontSize: "13px", lineHeight: 1, display: "inline-block" }}>🔥</span>
                        <span style={{ fontSize: "11.5px", color: "#64748B" }}>PSE — percepção subjetiva de esforço</span>
                      </div>
                      <div style={{ display: "flex", gap: "4px", flexWrap: "wrap" }}>
                        {Array.from({ length: 10 }, (_, i) => i + 1).map((n) => (
                          <button
                            key={n}
                            onClick={() => updateFeedback(ex.id, { pse: n })}
                            style={{
                              width: "24px",
                              height: "24px",
                              borderRadius: "6px",
                              border: `1px solid ${pse === n ? pseColor(n) : "#E2E8F0"}`,
                              background: pse === n ? pseColor(n) : "#FFFFFF",
                              color: pse === n ? "#172033" : "#64748B",
                              fontSize: "11px",
                              fontWeight: 600,
                              cursor: "pointer",
                            }}
                          >
                            {n}
                          </button>
                        ))}
                      </div>
                      <div style={{ display: "flex", justifyContent: "space-between", fontSize: "10.5px", color: "#64748B", marginTop: "4px" }}>
                        <span>1 · leve</span>
                        <span>10 · estou quase morrendo</span>
                      </div>
                    </div>

                    <div onClick={(e) => e.stopPropagation()} style={{ marginTop: "12px" }}>
                      <div style={{ display: "flex", alignItems: "center", gap: "6px", marginBottom: "5px" }}>
                        <span style={{ fontSize: "13px", lineHeight: 1, display: "inline-block" }}>💬</span>
                        <span style={{ fontSize: "11.5px", color: "#64748B" }}>Observação para o personal</span>
                      </div>
                      <textarea
                        value={note}
                        onChange={(e) => updateFeedback(ex.id, { note: e.target.value })}
                        placeholder="Ex: senti dor no joelho, consegui fazer fácil, precisei diminuir a carga..."
                        rows={2}
                        style={{ ...inputStyle(), resize: "vertical", fontFamily: "'Inter', sans-serif", fontSize: "12.5px", width: "100%" }}
                      />
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {error && <ErrorBanner text={error} />}
    </div>
  );
}

function ErrorBanner({ text }) {
  return (
    <div style={{ position: "sticky", bottom: 0, background: "#FEF2F2", color: "#B91C1C", padding: "10px 24px", fontSize: "12.5px" }}>
      {text}
    </div>
  );
}

function pseColor(n) {
  if (n <= 3) return "#8BC34A";
  if (n <= 6) return "#FFC107";
  if (n <= 8) return "#FF8A3D";
  return "#EF4444";
}

/* ---------------- shared style helpers ---------------- */

function inputStyle(extra = {}) {
  return {
    background: "#F8FAFC",
    border: "1px solid #E2E8F0",
    borderRadius: "8px",
    padding: "9px 10px",
    color: "#172033",
    fontSize: "13.5px",
    outline: "none",
    ...extra,
  };
}

function ghostBtn() {
  return {
    display: "flex",
    alignItems: "center",
    gap: "5px",
    background: "transparent",
    border: "1px solid #E2E8F0",
    color: "#64748B",
    borderRadius: "7px",
    padding: "6px 10px",
    fontSize: "12px",
    cursor: "pointer",
  };
}

function smallBtn(bg, color = "#FFFFFF") {
  return {
    display: "flex",
    alignItems: "center",
    gap: "5px",
    background: bg,
    border: "none",
    color,
    borderRadius: "7px",
    padding: "7px 12px",
    fontSize: "12.5px",
    fontWeight: 600,
    cursor: "pointer",
  };
}

function iconBtn(color = "#64748B") {
  return {
    display: "flex",
    alignItems: "center",
    justifyContent: "center",
    width: "30px",
    height: "30px",
    background: "#F8FAFC",
    border: "1px solid #E2E8F0",
    borderRadius: "8px",
    color,
    cursor: "pointer",
  };
}

function addExerciseBtn() {
  return {
    display: "flex",
    alignItems: "center",
    justifyContent: "center",
    gap: "7px",
    background: "transparent",
    border: "1.5px dashed #60A5FA",
    color: "#2563EB",
    borderRadius: "12px",
    padding: "13px",
    fontSize: "13.5px",
    fontWeight: 600,
    fontFamily: "'Oswald', sans-serif",
    cursor: "pointer",
  };
}

const rootEl = document.getElementById("root");
const root = ReactDOM.createRoot(rootEl);
root.render(<App />);

</script>
</body>
</html>
